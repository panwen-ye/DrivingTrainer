name: DrivingTrainer
options:
  bundleIdPrefix: com.panwenye
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  DrivingTrainerCore:
    path: .

settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  DrivingTrainerApp:
    type: application
    platform: iOS
    sources:
      - path: apps/iOS/Sources
    dependencies:
      - target: DrivingTrainerWatch
        embed: true
      - package: DrivingTrainerCore
        product: DrivingTrainerDomain
      - package: DrivingTrainerCore
        product: DrivingTrainerPersistence
      - package: DrivingTrainerCore
        product: DrivingTrainerLocationKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panwenye.DrivingTrainer
        PRODUCT_NAME: 驾考训练
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: 驾考训练
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 用于记录训练轨迹，并在接近考试节点时提供提醒。
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        TARGETED_DEVICE_FAMILY: "1"

  DrivingTrainerWatch:
    type: application
    platform: watchOS
    sources:
      - path: apps/watchOS/Sources
    dependencies:
      - package: DrivingTrainerCore
        product: DrivingTrainerDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panwenye.DrivingTrainer.watchkitapp
        PRODUCT_NAME: 驾考训练
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: 驾考训练
        INFOPLIST_KEY_WKApplication: true

schemes:
  DrivingTrainerApp:
    build:
      targets:
        DrivingTrainerApp: all
    run:
      config: Debug
    test:
      config: Debug
  DrivingTrainerWatch:
    build:
      targets:
        DrivingTrainerWatch: all
    run:
      config: Debug
